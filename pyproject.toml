[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "golazo"
version = "0.1.0"
description = "Golazo service for Codex-driven implementation goal tracking"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]
desktop = ["pyinstaller>=6,<7"]

[project.scripts]
golazo = "golazo.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/golazo"]

[tool.hatch.build.targets.wheel.force-include]
"skills/manage-implementation/scripts/implementation_tracker.py" = "golazo/implementation_tracker.py"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
